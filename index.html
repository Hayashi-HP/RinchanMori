<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>りんちゃんの杜 v1.0.14</title>
  <link rel="stylesheet" href="css/style.css?v=1014">
  <link rel="stylesheet" href="css/ui-v042.css?v=1014">
  <link rel="stylesheet" href="css/v081-fixes.css?v=1014">
  <link rel="stylesheet" href="css/v094-guide.css?v=1014">
  <link rel="stylesheet" href="css/v102-rinchan-face.css?v=1014">
  <link rel="stylesheet" href="css/v097-home-fixes.css?v=1014">
  <link rel="stylesheet" href="css/v128-mobile-polish.css?v=1014">
  <link rel="stylesheet" href="css/v1013-hotfix.css?v=1014">
  <link rel="stylesheet" href="css/v1014-hotfix.css?v=1014">
</head>
<body>
<main class="app">
  <header class="top"><div class="brand rinchan-brand"><img class="rin-img rin-face-brand" src="assets/rinchan-face.svg?v=1014" alt="りんちゃん"><span>りんちゃんの杜</span></div><a class="icon-button bell-link" href="pages/news.html" aria-label="りんちゃん通信">&#128236;<span class="notify-badge hidden">0</span></a></header>
  <section class="sky home-hero"><div class="petal p1">&#127800;</div><div class="petal p2">&#127800;</div><div class="cloud c1"></div><div class="cloud c2"></div><img class="rin-img rin-face-hero" src="assets/rinchan-face.svg?v=1014" alt="りんちゃん"><p class="hello" id="dailyGreeting">こんにちは</p><h1><span id="name">ゲスト</span>さん</h1><p class="msg" id="dailyMessage">歩けば、みんなの杜になる。</p><div class="hero-challenge"><span>りんちゃんの今日の一歩</span><strong id="todayChallenge">階段を1回使ってみよう</strong></div></section>
  <section class="card" id="guestEntryPanel" style="text-align:center;"><h2 style="text-align:center;margin-bottom:20px;">りんちゃんの杜へようこそ</h2><a class="submit link-submit" href="pages/login.html">ログイン</a><p class="login-helper" style="margin-top:18px;">はじめて利用する方は <a href="pages/register.html">新規登録</a></p></section>
  <section class="card auth-card hidden" id="authCard"></section>
  <section class="big-action focus-action primary-record-action"><a href="pages/activity.html"><span>&#128095;</span><strong>活動を記録する</strong><small></small></a></section>
  <section class="card steps-visual-card" id="weeklyStepsChart"></section>
  <section class="tree-stage"><p class="label">あなたの木</p><div class="tree-world growth-world"><div class="tree" id="treeIcon">&#127793;</div><div class="bird">&#128038;</div><div class="sparkle">&#10024;</div></div><h2 id="treeTitle">小さな芽が出ました</h2><p id="treeText">活動を記録すると、あなたの木が少しずつ育ちます。</p><div class="growth-meter"><div id="growthBar"></div></div><p class="growth-note" id="growthNote">次の成長まで、あと少し。</p></section>
  <nav class="nav"><a class="active" href="index.html">&#127968;<small>ホーム</small></a><a href="pages/mori.html">&#127795;<small>杜</small></a><a class="plus" href="pages/activity.html">&#128095;<small>歩数記録</small></a><a href="pages/news.html">&#128236;<small>通信</small></a><a href="pages/mypage.html">&#128100;<small>マイページ</small></a></nav>
</main>
<script src="js/config.js?v=1014"></script><script src="js/core/storage.js?v=1014"></script><script src="js/core/error-log.js?v=1014"></script><script src="js/core/api.js?v=1014"></script><script src="js/core/sync.js?v=1014"></script><script src="js/core/offline-queue.js?v=1014"></script><script src="js/features/auth.js?v=1014"></script><script src="js/features/activity.js?v=1014"></script><script src="js/features/news.js?v=1014"></script><script src="js/features/mypage.js?v=1014"></script><script src="js/features/growth.js?v=1014"></script><script src="js/features/chart.js?v=1014"></script><script src="js/features/guide.js?v=1014"></script>
<script>
(function(){
  function user(){ try { return window.RinchanStorage ? RinchanStorage.getParticipant() : JSON.parse(localStorage.getItem('rinchanParticipant') || 'null'); } catch(e) { return null; } }
  function text(v){ return String(v || '').trim().length > 0; }
  function ok(u){ return !!(u && (text(u.employeeId) || text(u.id)) && (text(u.name) || text(u.nick) || text(u.dept))); }
  function hide(el){ if (el) el.classList.add('hidden'); }
  function show(el){ if (el) el.classList.remove('hidden'); }
  function greeting(){ var h = new Date().getHours(); if (h < 11) return 'おはようございます'; if (h < 17) return 'こんにちは'; return 'こんばんは'; }
  function displayName(u){ return text(u.nick) ? u.nick : (text(u.name) ? u.name : 'ゲスト'); }
  function apply(){
    var u = user();
    var loggedIn = ok(u);
    var guest = document.getElementById('guestEntryPanel');
    var auth = document.getElementById('authCard');
    var record = document.querySelector('.primary-record-action');
    var chart = document.getElementById('weeklyStepsChart');
    var tree = document.querySelector('.tree-stage');
    var nav = document.querySelector('.nav');
    var bell = document.querySelector('.bell-link');
    var name = document.getElementById('name');
    var greet = document.getElementById('dailyGreeting');
    if (greet) greet.textContent = greeting();
    if (!loggedIn) { if (name) name.textContent = 'ゲスト'; show(guest); hide(auth); hide(record); hide(chart); hide(tree); hide(nav); hide(bell); return; }
    if (name) name.textContent = displayName(u);
    hide(guest); hide(auth); show(record); show(chart); show(tree); show(nav); show(bell);
    setTimeout(function(){ try { if (window.renderV078Chart) window.renderV078Chart(); } catch(e){} }, 100);
    setTimeout(function(){ try { if (window.renderV078Chart) window.renderV078Chart(); } catch(e){} }, 1200);
  }
  window.renderRinchanHomeAuth = apply;
  document.addEventListener('DOMContentLoaded', apply);
  window.addEventListener('pageshow', apply);
  setTimeout(apply, 300);
  setTimeout(apply, 1200);
})();
</script>
</body>
</html>
