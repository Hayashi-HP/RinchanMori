<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>りんちゃんの杜 MVP-008</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <img src="assets/logo/hhg-logo.jpg" class="logo" alt="HHG">
      <span>りんちゃんの杜</span>
    </div>
    <button class="icon-button">🔔</button>
  </header>

  <section class="sky home-hero">
    <div class="petal p1">🌸</div>
    <div class="petal p2">🌸</div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="rin">😊</div>
    <p class="hello" id="dailyGreeting">おはようございます</p>
    <h1><span id="name">ゲスト</span>さん</h1>
    <p class="msg" id="dailyMessage">今日もあなたの木が待っています。</p>
  </section>

  <section class="tree-stage">
    <p class="label">あなたの木</p>
    <div class="tree-world growth-world">
      <div class="tree" id="treeIcon">🌱</div>
      <div class="bird">🐦</div>
      <div class="sparkle">✨</div>
    </div>
    <h2 id="treeTitle">小さな芽が出ました</h2>
    <p id="treeText">活動を記録すると、あなたの木が少しずつ育ちます。</p>
    <div class="growth-meter">
      <div id="growthBar"></div>
    </div>
    <p class="growth-note" id="growthNote">次の成長まで、あと少し。</p>
  </section>

  <section class="challenge-card">
    <p class="label">今日のおすすめ</p>
    <h2 id="todayChallenge">階段を1回使ってみよう</h2>
    <p>できたら活動記録のチャレンジにチェック。できなくても大丈夫です。</p>
  </section>

  <section class="big-action focus-action">
    <a href="pages/activity.html">
      <span>🌿</span>
      <strong>活動を記録する</strong>
      <small>今日も30秒</small>
    </a>
  </section>

  <section class="card mori-news">
    <p class="label">杜ニュース</p>
    <h2>🌷 春の花壇が明るくなりました</h2>
    <p>職員みんなの健康づくりで、杜に少しずつ彩りが増えています。</p>
    <a class="mini-link" href="pages/mori.html">杜を見る →</a>
  </section>

  <nav class="nav">
    <a class="active" href="index.html">🏠<small>ホーム</small></a>
    <a href="pages/mori.html">🌳<small>杜</small></a>
    <a class="plus" href="pages/activity.html">＋<small>記録</small></a>
    <a href="pages/news.html">📖<small>お知らせ</small></a>
    <a href="pages/mypage.html">👤<small>マイページ</small></a>
  </nav>
</main>
<script src="js/config.js"></script><script src="js/app.js"></script>
</body>
</html>
