<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>りんちゃんの杜 v0.9.70</title>
  <link rel="stylesheet" href="css/style.css?v=0970">
  <link rel="stylesheet" href="css/ui-v042.css?v=0970">
  <link rel="stylesheet" href="css/v081-fixes.css?v=0970">
  <link rel="stylesheet" href="css/v094-guide.css?v=0970">
  <link rel="stylesheet" href="css/v102-rinchan-face.css?v=0970">
  <link rel="stylesheet" href="css/v128-mobile-polish.css?v=0970">
</head>
<body>
<main class="app">
  <header class="top"><div class="brand rinchan-brand"><img class="rin-img rin-face-brand" src="assets/rinchan-face.svg?v=0970" alt="りんちゃん"><span>りんちゃんの杜</span></div><a class="icon-button bell-link" href="pages/news.html" aria-label="りんちゃん通信">&#128236;<span class="notify-badge hidden">0</span></a></header>
  <section class="sky home-hero"><div class="petal p1">&#127800;</div><div class="petal p2">&#127800;</div><div class="cloud c1"></div><div class="cloud c2"></div><img class="rin-img rin-face-hero" src="assets/rinchan-face.svg?v=0970" alt="りんちゃん"><p class="hello" id="dailyGreeting">おはようございます</p><h1><span id="name">ゲスト</span>さん</h1><p class="msg" id="dailyMessage">歩けば、みんなの杜になる。</p><div class="hero-challenge"><span>りんちゃんの今日の一歩</span><strong id="todayChallenge">階段を1回使ってみよう</strong></div></section>
  <section class="card auth-card" id="authCard"></section>
  <section class="big-action focus-action primary-record-action"><a href="pages/activity.html"><span>&#128095;</span><strong>活動を記録する</strong><small></small></a></section>
  <section class="card steps-visual-card" id="weeklyStepsChart"></section>
  <section class="tree-stage"><p class="label">あなたの木</p><div class="tree-world growth-world"><div class="tree" id="treeIcon">&#127793;</div><div class="bird">&#128038;</div><div class="sparkle">&#10024;</div></div><h2 id="treeTitle">小さな芽が出ました</h2><p id="treeText">活動を記録すると、あなたの木が少しずつ育ちます。</p><div class="growth-meter"><div id="growthBar"></div></div><p class="growth-note" id="growthNote">次の成長まで、あと少し。</p></section>
  <nav class="nav"><a class="active" href="index.html">&#127968;<small>ホーム</small></a><a href="pages/mori.html">&#127795;<small>杜</small></a><a class="plus" href="pages/activity.html">&#128095;<small>歩数記録</small></a><a href="pages/news.html">&#128236;<small>通信</small></a><a href="pages/mypage.html">&#128100;<small>マイページ</small></a></nav>
</main>
<script src="js/config.js?v=0970"></script><script src="js/core/storage.js?v=0970"></script><script src="js/core/error-log.js?v=0970"></script><script src="js/core/api.js?v=0970"></script><script src="js/core/sync.js?v=0970"></script><script src="js/core/offline-queue.js?v=0970"></script><script src="js/features/auth.js?v=0970"></script><script src="js/features/activity.js?v=0970"></script><script src="js/features/news.js?v=0970"></script><script src="js/features/mypage.js?v=0970"></script><script src="js/features/growth.js?v=0970"></script><script src="js/features/chart.js?v=0970"></script><script src="js/features/guide.js?v=0970"></script>
<script>
(function(){
  function getUser(){
    try {
      if (window.RinchanStorage && typeof RinchanStorage.getParticipant === 'function') return RinchanStorage.getParticipant();
      return JSON.parse(localStorage.getItem('rinchanParticipant') || 'null');
    } catch(e) { return null; }
  }
  function hide(el){ if(el) el.classList.add('hidden'); }
  function show(el){ if(el) el.classList.remove('hidden'); }
  document.addEventListener('DOMContentLoaded', function(){
    var user = getUser();
    var loggedIn = !!(user && (user.employeeId || user.id));
    var authCard = document.getElementById('authCard');
    var record = document.querySelector('.primary-record-action');
    var chart = document.getElementById('weeklyStepsChart');
    var tree = document.querySelector('.tree-stage');
    var nav = document.querySelector('.nav');
    var bell = document.querySelector('.bell-link');
    if (!authCard) return;
    if (!loggedIn) {
      authCard.innerHTML = '<div class="welcome-card"><img class="rin-img rin-face-small" src="assets/rinchan-face.svg?v=0970" alt="りんちゃん"><p class="label">職員専用アプリ</p><h2>りんちゃんの杜へようこそ</h2><p>はじめて利用する方は新規登録、登録済みの方はログインしてください。</p><div class="welcome-actions"><a class="submit link-submit" href="pages/login.html">ログイン</a><a class="soft-link" href="pages/register.html">はじめて利用する（新規登録）</a></div></div>';
      hide(record); hide(chart); hide(tree); hide(nav); hide(bell);
      var name = document.getElementById('name');
      if (name) name.textContent = 'ゲスト';
      return;
    }
    authCard.innerHTML = '';
    hide(authCard);
    show(record); show(chart); show(tree); show(nav); show(bell);
  });
})();
</script>
</body>
</html>
