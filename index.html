  <section class="sky home-hero"><div class="petal p1">&#127800;</div><div class="petal p2">&#127800;</div><div class="cloud c1"></div><div class="cloud c2"></div><img class="rin-img rin-face-hero" src="assets/rinchan-face.svg?v=0978" alt="りんちゃん"><p class="hello" id="dailyGreeting">おはようございます</p><h1><span id="name">ゲスト</span>さん</h1><p class="msg" id="dailyMessage">歩けば、みんなの杜になる。</p><div class="hero-challenge"><span>りんちゃんの今日の一歩</span><strong id="todayChallenge">階段を1回使ってみよう</strong></div></section>

<script>
(function(){
  var guestHtml = '<div class="welcome-card"><img class="rin-img rin-face-small" src="assets/rinchan-face.svg?v=0978" alt="りんちゃん"><p class="label">職員専用アプリ</p><h2>りんちゃんの杜へようこそ</h2><p>はじめて利用する方は新規登録、登録済みの方はログインしてください。</p><div class="welcome-actions"><a class="submit link-submit" href="pages/login.html">ログイン</a><a class="soft-button soft-link" href="pages/register.html">はじめて利用する（新規登録）</a></div></div>';
  var restoring = false;
  function getUser(){
    try {
      if (window.RinchanStorage && typeof RinchanStorage.getParticipant === 'function') return RinchanStorage.getParticipant();
      return JSON.parse(localStorage.getItem('rinchanParticipant') || 'null');
    } catch(e) { return null; }
  }
  function hasText(value){ return String(value || '').trim().length > 0; }
  function isValidUser(user){
    if (!user) return false;
    var hasId = hasText(user.employeeId) || hasText(user.id);
    var hasProfile = hasText(user.name) || hasText(user.nick) || hasText(user.dept);
    var nameEl = document.getElementById('name');
    var looksGuest = nameEl && String(nameEl.textContent || '').trim() === 'ゲスト';
    return hasId && hasProfile && !looksGuest;
  }
  function hideForce(el){
    if (!el) return;
    el.classList.add('hidden');
    el.style.setProperty('display', 'none', 'important');
  }
  function showForce(el){
    if (!el) return;
    el.classList.remove('hidden');
    el.style.setProperty('display', 'block', 'important');
    el.style.setProperty('visibility', 'visible', 'important');
    el.style.setProperty('opacity', '1', 'important');
  }
  function renderHomeAuth(){
    if (restoring) return;
    restoring = true;
    var user = getUser();
    var loggedIn = isValidUser(user);
    var authCard = document.getElementById('authCard');
    var record = document.querySelector('.primary-record-action');
    var chart = document.getElementById('weeklyStepsChart');
    var tree = document.querySelector('.tree-stage');
    var nav = document.querySelector('.nav');
    var bell = document.querySelector('.bell-link');
    if (!authCard) { restoring = false; return; }
    if (!loggedIn) {
      showForce(authCard);
      if (!authCard.querySelector('.welcome-actions')) authCard.innerHTML = guestHtml;
      hideForce(record); hideForce(chart); hideForce(tree); hideForce(nav); hideForce(bell);
      var name = document.getElementById('name');
      if (name) name.textContent = 'ゲスト';
      restoring = false;
      return;
    }
    authCard.innerHTML = '';
    hideForce(authCard);
    [record, chart, tree, nav, bell].forEach(function(el){
      if (!el) return;
      el.classList.remove('hidden');
      el.style.removeProperty('display');
      el.style.removeProperty('visibility');
      el.style.removeProperty('opacity');
    });
    restoring = false;
  }
  function installGuard(){
    renderHomeAuth();
    if (window.MutationObserver) {
      var target = document.querySelector('.app') || document.body;
      var observer = new MutationObserver(function(){ renderHomeAuth(); });
      observer.observe(target, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style'] });
    }
    var count = 0;
    var timer = setInterval(function(){
      renderHomeAuth();
      count += 1;
      if (count >= 20) clearInterval(timer);
    }, 500);
  }
  window.renderRinchanHomeAuth = renderHomeAuth;
  document.addEventListener('DOMContentLoaded', installGuard);
  window.addEventListener('pageshow', installGuard);
  setTimeout(installGuard, 200);
})();
</script>
</body>
