<main class="app">
  <header class="top"><div class="brand"><img src="assets/logo/hhg-logo.jpg" class="logo" alt="HHG"><span>りんちゃんの杜</span></div><a class="icon-button bell-link" href="pages/news.html" aria-label="お知らせ">🔔<span class="notify-badge hidden">0</span></a></header>
  <section class="sky home-hero"><div class="petal p1">🌸</div><div class="petal p2">🌸</div><div class="cloud c1"></div><div class="cloud c2"></div><div class="rin">😊</div><p class="hello" id="dailyGreeting">おはようございます</p><h1><span id="name">ゲスト</span>さん</h1><p class="msg" id="dailyMessage">今日もみんなで杜を育てましょう。</p></section>
  <section class="big-action focus-action primary-record-action"><a href="pages/activity.html"><span>👟</span><strong>活動を記録する</strong><small class="sr-only"></small></a></section>
  <section class="card forest-level-card" id="forestLevelCard"></section>
  <section class="card steps-visual-card" id="weeklyStepsChart"></section>
  <section class="tree-stage"><p class="label">あなたの木</p><div class="tree-world growth-world"><div class="tree" id="treeIcon">🌱</div><div class="bird">🐦</div><div class="sparkle">✨</div></div><h2 id="treeTitle">小さな芽が出ました</h2><p id="treeText">活動を記録すると、あなたの木が少しずつ育ちます。</p><div class="growth-meter"><div id="growthBar"></div></div><p class="growth-note" id="growthNote">次の成長まで、あと少し。</p></section>
  <section class="card forest-news-card"><p class="label">🌿 今日の杜ニュース</p><div id="forestNewsList" class="forest-news-list"></div></section>
  <section class="challenge-card"><p class="label">今日のおすすめ</p><h2 id="todayChallenge">階段を1回使ってみよう</h2><p>できたら活動記録のチャレンジにチェック。できなくても大丈夫です。</p></section>
  <section class="card"><p class="label">マイバッジ</p><h2>獲得バッジ</h2><div id="badgeList" class="badge-list"></div></section>
  <section class="card mori-news"><p class="label">杜を見る</p><h2>🌳 みんなの木が育っています</h2><p>職員みんなの健康づくりで、杜に少しずつ彩りが増えています。</p><a class="mini-link" href="pages/mori.html">杜を見る →</a></section>
