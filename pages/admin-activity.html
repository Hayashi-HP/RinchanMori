<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>歩数修正｜りんちゃんの杜</title>
  <link rel="icon" href="../assets/rinchan-face.svg?v=1049" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=157">
  <link rel="stylesheet" href="../css/ui-v042.css?v=157">
  <link rel="stylesheet" href="../css/sync-status-design.css?v=244">
  <link rel="stylesheet" href="../css/admin-design-system.css?v=248">
</head>
<body class="rinchan-admin-system">
<main class="app admin-app-v132 admin-activity-app">
  <header class="top"><a href="admin.html" class="back icon-button" aria-label="管理画面へ戻る"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a><div class="page-title">歩数修正</div><button class="icon-button admin-refresh-button" id="adminActivityRefresh" type="button" aria-label="歩数一覧を更新"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9A7 7 0 0 1 18 6l2 2M17.9 15A7 7 0 0 1 6 18l-2-2"/></svg></button></header>
  <nav class="nav" aria-label="メインメニュー"><a href="../index.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><small>ホーム</small></a><a href="mori.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22v-7M8 22h8M5 15h14L16 9h2L12 2 6 9h2Z"/></svg><small>杜</small></a><a class="plus" href="activity.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18c-2.5 0-5 1-5 3h10c0-2-2.5-3-5-3Zm6-15c-2 0-3 3.2-3 6s1 5 3 5 3-2.2 3-5-1-6-3-6Z"/></svg><small>歩数記録</small></a><a href="news.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 7l8 6 8-6"/></svg><small>通信</small></a><a href="mypage.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><small>パスポート</small></a></nav>
  <section class="admin-hero">
    <p class="label">管理者専用</p>
    <h1>日別歩数の修正</h1>
    <p>対象日と職員を絞り込み、必要な場合のみ安全に歩数を修正します。</p>
    <div class="admin-updated" id="adminActivityStatus">読み込み中...</div>
  </section>

  <section class="admin-card">
    <h2>検索条件</h2>
    <div class="admin-activity-filters">
      <label>対象日<input id="adminActivityDate" type="date"></label>
      <label>職員検索<input id="adminActivityQuery" type="search" placeholder="氏名・社員番号・部署"></label>
      <label>部署<select id="adminActivityDept"><option value="">全部署</option></select></label>
    </div>
  </section>

  <section class="admin-card">
    <h2>歩数一覧</h2>
    <p class="admin-note">対象日の現在歩数を表示します。修正は「修正」ボタンから行ってください。</p>
    <div id="adminActivityList" class="admin-activity-list"><p class="admin-empty">読み込み中...</p></div>
  </section>

  <section class="admin-card hidden" id="adminActivityEditor">
    <h2>歩数修正フォーム</h2>
    <p id="adminActivityTarget" class="admin-note">対象者を選択してください。</p>
    <div class="admin-activity-editor-grid">
      <label>現在歩数<input id="adminCurrentSteps" type="text" readonly></label>
      <label>新しい歩数<input id="adminNewSteps" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label>
    </div>
    <label>修正理由（必須）<textarea id="adminEditReason" rows="3" placeholder="例: Appleショートカット誤送信のため"></textarea></label>
    <div class="admin-activity-actions">
      <button type="button" class="admin-button" id="adminEditSave">保存</button>
      <button type="button" class="admin-button soft" id="adminEditCancel">キャンセル</button>
    </div>
    <div id="adminActivityMessage" class="admin-activity-message" aria-live="polite"></div>
  </section>

  <section class="big-action focus-action admin-return-action"><a href="admin.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><strong>管理画面へ戻る</strong><small>運用チェックへ戻る</small></a></section>
</main>
<script src="../js/core/device-class.js?v=186"></script><script src="../js/config.js?v=157"></script><script src="../js/core/storage.js?v=240"></script><script src="../js/core/error-log.js?v=157"></script><script src="../js/core/api.js?v=180"></script><script src="../js/core/sync.js?v=240"></script><script src="../js/core/offline-queue.js?v=244"></script><script src="../js/features/admin-activity.js?v=206"></script>
</body>
</html>
