<html lang="ja">

  <link rel="stylesheet" href="../css/style.css?v=0914"><link rel="stylesheet" href="../css/ui-v042.css?v=0914"><link rel="stylesheet" href="../css/v102-rinchan-face.css?v=0914">

<body><main class="app"><header class="top"><a href="../index.html" class="back">←</a><div class="page-title">参加登録</div><span class="spacer"></span></header><section class="intro"><div class="rin small">😊</div><h1>ようこそ<br>りんちゃんの杜へ</h1><p>社員番号であなたの木を登録します。</p></section><form class="form register-form" id="registerForm"><label>社員番号<input id="employeeId" required inputmode="numeric" placeholder="例：1023"></label><label>氏名<input id="userName" required placeholder="例：花田 博実"></label><label>所属<select id="dept" required><option value="">選択してください</option><option>看護部</option><option>リハビリテーション部</option><option>介護部</option><option>医局</option><option>薬剤部</option><option>栄養科</option><option>事務部</option><option>その他</option></select></label><label>メールアドレス<input id="email" type="email" placeholder="例：name@hayashi-hp.or.jp"></label><label>誕生日4桁<input id="pin4" required inputmode="numeric" maxlength="4" placeholder="例：4月8日 → 0408"></label><label>ニックネーム（任意）<input id="nick" placeholder="例：はなだ"></label><button class="submit pill-button" type="submit">登録する</button></form><section class="card"><p class="label">登録済みの方</p><h2>別の端末ではログインできます</h2><p>社員番号と誕生日4桁でログインしてください。</p><a class="submit link-submit" href="login.html">ログインする</a></section></main><script src="../js/config.js?v=0914"></script><script src="../js/app.js?v=0914"></script><script src="../js/v051-auth.js?v=0914"></script></body></html>
