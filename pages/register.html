<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>新規登録｜りんちゃんの杜</title>
  <link rel="icon" href="../assets/rinchan-face.svg?v=1049" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=178">
  <link rel="stylesheet" href="../css/auth-design-system.css?v=240">
</head>
<body class="rinchan-auth-system">
<main class="auth-app">
  <header class="auth-header">
    <a class="auth-back" href="../index.html" aria-label="ホームへ戻る">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <a class="auth-brand" href="../index.html" aria-label="りんちゃんの杜 ホーム">りんちゃんの杜</a>
    <span class="auth-header-spacer" aria-hidden="true"></span>
  </header>

  <div class="auth-layout auth-layout-register">
    <section class="auth-story" aria-labelledby="registerWelcomeTitle">
      <div class="auth-character-wrap">
        <img class="auth-character" src="../assets/rinchan-face.svg?v=178" alt="りんちゃん">
      </div>
      <p class="auth-eyebrow">JOIN THE FOREST</p>
      <h1 id="registerWelcomeTitle">あなたの木を<br>植えましょう</h1>
      <p>健康の記録と仲間へのありがとうを、ひとつの杜で育てます。</p>
      <ol class="auth-steps" aria-label="利用開始までの流れ">
        <li><span>1</span><strong>基本情報を登録</strong></li>
        <li><span>2</span><strong>あなたの木が誕生</strong></li>
        <li><span>3</span><strong>毎日の一歩を記録</strong></li>
      </ol>
    </section>

    <section class="auth-panel" aria-labelledby="registerTitle">
      <div class="auth-panel-heading">
        <p class="auth-eyebrow">CREATE ACCOUNT</p>
        <h2 id="registerTitle">新規登録</h2>
        <p>職員情報を入力してください。登録後に変更できます。</p>
      </div>
      <form class="auth-form auth-register-form" id="registerForm" novalidate>
        <div class="auth-fields-grid">
          <div class="auth-field">
            <label for="employeeId">社員番号</label>
            <input id="employeeId" name="employeeId" type="text" required inputmode="numeric" autocomplete="username" enterkeyhint="next" pattern="[0-9]*" placeholder="例：2110401">
          </div>
          <div class="auth-field">
            <label for="userName">氏名</label>
            <input id="userName" name="name" type="text" required autocomplete="name" enterkeyhint="next" placeholder="例：林 花子">
          </div>
          <div class="auth-field auth-field-wide">
            <label for="dept">所属</label>
            <select id="dept" name="department" required autocomplete="organization">
              <option value="">選択してください</option>
            </select>
          </div>
          <div class="auth-field">
            <div class="auth-label-row"><label for="pin4">誕生日4桁</label><small>4月8日なら 0408</small></div>
            <div class="auth-pin-wrap">
              <input id="pin4" name="pin4" type="password" required inputmode="numeric" autocomplete="new-password" enterkeyhint="next" pattern="[0-9]{4}" maxlength="4" placeholder="4桁で入力" aria-describedby="registerPinHelp">
              <button class="auth-pin-toggle" type="button" data-pin-toggle="pin4" aria-label="誕生日4桁を表示" aria-pressed="false">
                <svg class="pin-eye-show" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pin-eye-hide" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.1 3.2M6.6 6.6C3.6 8.5 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4.1-.9"/></svg>
              </button>
            </div>
            <small class="auth-field-help" id="registerPinHelp">本人確認に使用し、アプリ内には保存しません。</small>
          </div>
          <div class="auth-field">
            <label for="nick">ニックネーム <small>任意</small></label>
            <input id="nick" name="nickname" type="text" autocomplete="off" enterkeyhint="done" maxlength="30" placeholder="例：はなちゃん">
          </div>
        </div>
        <button class="auth-submit" type="submit">
          <span>杜に参加する</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </form>
      <p class="auth-switch">登録済みの方は <a href="login.html">ログインへ</a></p>
    </section>
  </div>
</main>
<script src="../js/config.js?v=219"></script>
<script src="../js/core/storage.js?v=240"></script>
<script src="../js/core/error-log.js?v=178"></script>
<script src="../js/core/api.js?v=178"></script>
<script src="../js/core/sync.js?v=240"></script>
<script src="../js/core/offline-queue.js?v=178"></script>
<script src="../js/core/rinchan-modal.js?v=178"></script>
<script src="../js/v127-departments.js?v=240"></script>
<script src="../js/features/auth.js?v=240"></script>
</body>
</html>
