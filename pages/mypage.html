<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイページ｜りんちゃんの杜</title>
<link rel="stylesheet" href="../css/style.css?v=060"><link rel="stylesheet" href="../css/ui-v042.css?v=060">
</head>
<body><main class="app">
<header class="top"><a href="../index.html" class="back">←</a><div class="page-title">マイページ</div><span class="spacer"></span></header>
<section class="profile-card profile-main"><button class="edit-icon" onclick="showEdit('profileEdit')" aria-label="プロフィールを編集">✏️</button><div class="tree-large" id="treeIcon">🌱</div><p class="label">あなたの木</p><h1 id="myName">ゲストさん</h1><p id="myDept">参加登録をすると所属が表示されます。</p><p id="plantedDate" class="planted-date">🌱 あなたの木は、今日植えられました。</p></section>
<section class="tree-stage"><p class="label">成長レベル</p><h2 id="treeTitle">小さな芽が出ました</h2><p id="treeText">活動を記録すると、あなたの木が育ちます。</p><div class="growth-meter"><div id="growthBar"></div></div><p class="growth-note" id="growthNote">次の成長まで、あと少し。</p></section>
<section class="card"><p class="label">マイバッジ</p><h2>獲得バッジ</h2><div id="badgeList" class="badge-list"></div></section>
<section id="profileEdit" class="form hidden"><label>氏名<input id="editName" placeholder="例：花田 博実"></label><label>所属<select id="editDept"><option value="">選択してください</option><option>看護部</option><option>リハビリテーション部</option><option>介護部</option><option>医局</option><option>薬剤部</option><option>栄養科</option><option>事務部</option><option>その他</option></select></label><label>ニックネーム<input id="editNick" placeholder="例：はなだ"></label><button class="submit pill-button" onclick="saveProfile()">保存する</button></section>
<section class="card declaration-card statement-card"><p class="label">わたしの健康宣言</p><p id="declarationText" class="statement-text">まだ登録されていません。</p><button class="soft-button pill-soft" onclick="showEdit('declarationEdit')">健康宣言を書く・編集する</button></section>
<section id="declarationEdit" class="form hidden"><label>健康宣言<textarea id="editDeclaration" rows="4" placeholder="例：無理なく歩く習慣をつけます"></textarea></label><button class="submit pill-button" onclick="saveDeclaration()">保存する</button></section>
<section class="card goal-card statement-card"><p class="label">今週の目標</p><p id="weeklyGoalText" class="statement-text">まずは無理なく続ける</p><button class="soft-button pill-soft" onclick="showEdit('goalEdit')">今週の目標を書く・編集する</button></section>
<section id="goalEdit" class="form hidden"><label>今週の目標<textarea id="editGoal" rows="3" placeholder="例：今週は3回活動を記録する"></textarea></label><button class="submit pill-button" onclick="saveGoal()">保存する</button></section>
<section class="card"><p class="label">活動記録</p><h2 id="activityCount">0回</h2><p>これまでに記録した活動回数です。</p></section>
<nav class="nav"><a href="../index.html">🏠<small>ホーム</small></a><a href="mori.html">🌳<small>杜</small></a><a class="plus" href="activity.html">👟<small>歩数記録</small></a><a href="news.html">📖<small>お知らせ</small></a><a class="active" href="mypage.html">👤<small>マイページ</small></a></nav>
</main><script src="../js/config.js?v=060"></script><script src="../js/app.js?v=060"></script><script src="../js/v051-auth.js?v=060"></script><script src="../js/v060-growth.js?v=060"></script></body></html>
