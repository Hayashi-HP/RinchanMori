<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイページ｜りんちゃんの杜 v0.9.9</title>
<link rel="stylesheet" href="../css/style.css?v=099"><link rel="stylesheet" href="../css/ui-v042.css?v=099"><link rel="stylesheet" href="../css/v081-fixes.css?v=099"><link rel="stylesheet" href="../css/v099-ui-fixes.css?v=099">
</head>
<body><main class="app" id="mypageV070">
<header class="top"><a href="../index.html" class="back">←</a><div class="page-title">マイページ</div><span class="spacer"></span></header>
<section class="profile-card profile-main v070-tree-card"><button class="edit-icon" onclick="showEdit('profileEdit')" aria-label="プロフィールを編集">✏️</button><div class="tree-large" id="treeIcon">🌱</div><p class="label">あなたの木</p><h1 id="treeTitle">小さな芽が出ました</h1><p id="treeText">活動を記録すると、あなたの木が育ちます。</p><div class="growth-meter"><div id="growthBar"></div></div><p id="growthNote" class="planted-date">次の成長まで、あと少し。</p></section>
<section id="profileEdit" class="form hidden edit-panel"><p class="label">プロフィール編集</p><label>氏名<input id="editName" placeholder="例：花田 博実"></label><label>所属<select id="editDept"><option value="">選択してください</option><option>看護部</option><option>リハビリテーション部</option><option>介護部</option><option>医局</option><option>薬剤部</option><option>栄養科</option><option>事務部</option><option>その他</option></select></label><label>ニックネーム<input id="editNick" placeholder="例：はなだ"></label><button class="submit pill-button" onclick="saveProfile()">保存する</button></section>
<section class="card v070-profile"><p class="label">👤 プロフィール</p><div class="info-grid"><span>氏名</span><strong id="v070ProfileName">ゲスト</strong><span>所属</span><strong id="v070ProfileDept">未設定</strong><span>社員番号</span><strong id="v070EmployeeId">-</strong><span>ニックネーム</span><strong id="v070ProfileNick">-</strong></div></section>
<section class="card v070-streak"><p class="label">🔥 継続</p><div class="mini-stats"><div><strong id="v070Streak">0日</strong><small>連続記録</small></div><div><strong id="v070BestStreak">0日</strong><small>自己最高</small></div></div></section>
<section class="card declaration-card statement-card"><p class="label">❤️ 健康宣言</p><p id="declarationText" class="statement-text">まだ登録されていません。</p><button class="soft-button pill-soft" onclick="showEdit('declarationEdit')">編集する</button></section>
<section id="declarationEdit" class="form hidden edit-panel"><p class="label">健康宣言編集</p><label>健康宣言<textarea id="editDeclaration" rows="4" placeholder="例：無理なく歩く習慣をつけます"></textarea></label><button class="submit pill-button" onclick="saveDeclaration()">保存する</button></section>
<section class="card goal-card statement-card"><p class="label">🎯 今週の目標</p><p id="weeklyGoalText" class="statement-text">まずは無理なく続ける</p><div id="v070WeeklyGoal"></div><button class="soft-button pill-soft" onclick="showEdit('goalEdit')">編集する</button></section>
<section id="goalEdit" class="form hidden edit-panel"><p class="label">目標編集</p><label>今週の目標<textarea id="editGoal" rows="3" placeholder="例：今週は3回活動を記録する"></textarea></label><button class="submit pill-button" onclick="saveGoal()">保存する</button></section>
<section class="card"><p class="label">🏅 マイバッジ</p><h2>獲得バッジ</h2><div id="badgeList" class="badge-list"></div></section>
<section class="card"><p class="label">🌳 木の情報</p><div class="mini-stats"><div><strong id="v070TreeAge">1日</strong><small>樹齢</small></div><div><strong id="v070TotalSteps">0歩</strong><small>累計歩数</small></div><div><strong id="v070ActivityCount">0回</strong><small>活動回数</small></div></div></section>
<section class="card"><p class="label">📈 最近の活動</p><div id="v070History" class="history-list"><p class="empty-note">まだ記録がありません。</p></div></section>
<nav class="nav"><a href="../index.html">🏠<small>ホーム</small></a><a href="mori.html">🌳<small>杜</small></a><a class="plus" href="activity.html">👟<small>歩数記録</small></a><a href="news.html">📖<small>お知らせ</small></a><a class="active" href="mypage.html">👤<small>マイページ</small></a></nav>
</main><script src="../js/config.js?v=099"></script><script src="../js/app.js?v=099"></script><script src="../js/v051-auth.js?v=099"></script><script src="../js/v060-growth.js?v=099"></script><script src="../js/v070-mypage.js?v=099"></script><script src="../js/v099-mypage-modal.js?v=099"></script></body></html>
