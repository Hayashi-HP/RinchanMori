<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>チャレンジ管理｜りんちゃんの杜</title>
  <link rel="icon" href="../assets/rinchan-face.svg?v=1049" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=157">
  <link rel="stylesheet" href="../css/ui-v042.css?v=157">
  <link rel="stylesheet" href="../css/sync-status-design.css?v=244">
  <link rel="stylesheet" href="../css/admin-design-system.css?v=254">
</head>
<body class="admin-page rinchan-admin-system">
<main class="app admin-app-v132 admin-challenges-app">
  <header class="top"><a href="admin.html" class="back icon-button" aria-label="管理画面へ戻る"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a><div class="page-title">管理画面</div><button class="icon-button admin-refresh-button" id="adminChallengesRefresh" type="button" aria-label="チャレンジ一覧を更新"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9A7 7 0 0 1 18 6l2 2M17.9 15A7 7 0 0 1 6 18l-2-2"/></svg></button></header>
  <nav class="nav" aria-label="メインメニュー"><a href="../index.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><small>ホーム</small></a><a href="mori.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22v-7M8 22h8M5 15h14L16 9h2L12 2 6 9h2Z"/></svg><small>杜</small></a><a class="plus" href="activity.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18c-2.5 0-5 1-5 3h10c0-2-2.5-3-5-3Zm6-15c-2 0-3 3.2-3 6s1 5 3 5 3-2.2 3-5-1-6-3-6Z"/></svg><small>歩数記録</small></a><a href="news.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 7l8 6 8-6"/></svg><small>通信</small></a><a href="mypage.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><small>パスポート</small></a></nav>

  <section class="admin-hero">
    <p class="label">管理者専用</p>
    <h1>チャレンジ管理</h1>
    <p><span class="admin-hero-line">毎月の標準チャレンジは自動で切り替わります。</span><span class="admin-hero-line">必要な月だけ内容を調整できます。</span></p>
    <div class="admin-updated" id="adminChallengesStatus">読み込み中...</div>
  </section>

  <section class="admin-card">
    <div class="admin-challenge-head-row">
      <div><h2>追加設定</h2><p class="admin-note">通常は操作不要です。設定がない種類は、季節に合わせた標準チャレンジを自動表示します。</p></div>
      <button type="button" class="admin-button" id="adminChallengeCreate">今月だけ調整</button>
    </div>
    <div class="admin-challenge-filters">
      <label>対象月
        <input id="adminChallengeFilterMonth" type="month">
      </label>
      <label>種類
        <select id="adminChallengeFilterScope">
          <option value="">すべて</option>
          <option value="individual">個人</option>
          <option value="department">部署</option>
          <option value="hospital">病院全体</option>
        </select>
      </label>
    </div>
    <div id="adminChallengesList" class="admin-challenge-list"><p class="admin-empty">読み込み中...</p></div>
  </section>

  <section class="admin-card hidden" id="adminChallengeEditor">
    <h2 id="adminChallengeEditorTitle">設定を追加</h2>
    <p class="admin-note">ここで保存した内容は、その月の標準チャレンジを上書きします。「休止」にすると、その種類自体を表示しません。標準へ戻す場合は一覧の「標準に戻す」を押してください。</p>
    <div class="admin-challenge-form-grid">
      <label>対象月（必須）
        <input id="adminChallengeMonth" type="month">
      </label>
      <label>種類（必須）
        <select id="adminChallengeScope">
          <option value="individual">個人</option>
          <option value="department">部署</option>
          <option value="hospital">病院全体</option>
        </select>
      </label>
      <label class="wide hidden" id="adminChallengeDeptWrap">対象部署
        <select id="adminChallengeDept"><option value="*">全部署共通</option></select>
      </label>
      <label>アイコン
        <input id="adminChallengeIcon" type="text" maxlength="20" placeholder="例: 👟">
      </label>
      <label>目標歩数（必須）
        <input id="adminChallengeTarget" type="number" min="1000" max="1000000000" step="1000" inputmode="numeric">
      </label>
      <label class="wide">タイトル（必須）
        <input id="adminChallengeTitle" type="text" maxlength="80" placeholder="例: 七夕ウォーク">
      </label>
      <label class="wide">達成前のメッセージ
        <textarea id="adminChallengeMessage" rows="3" maxlength="240" placeholder="例: 願いをこめて、今月も一歩ずつ。"></textarea>
      </label>
      <label class="wide">表示状態
        <select id="adminChallengeActive"><option value="true">表示する</option><option value="false">この種類を休止する</option></select>
      </label>
    </div>
    <div class="admin-challenge-form-actions">
      <button type="button" class="admin-button" id="adminChallengeSave">変更を保存</button>
      <button type="button" class="admin-button soft" id="adminChallengeCancel">キャンセル</button>
    </div>
    <div id="adminChallengeMessageBox" class="admin-challenge-message" aria-live="polite"></div>
  </section>

  <section class="big-action focus-action admin-return-action"><a href="admin.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><strong>管理画面へ戻る</strong><small>運用チェックへ戻る</small></a></section>
</main>

<script src="../js/config.js?v=157"></script><script src="../js/core/storage.js?v=240"></script><script src="../js/core/error-log.js?v=157"></script><script src="../js/core/api.js?v=181"></script><script src="../js/core/sync.js?v=241"></script><script src="../js/core/offline-queue.js?v=244"></script><script src="../js/features/admin-challenges.js?v=2"></script>
</body>
</html>
