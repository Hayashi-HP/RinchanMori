<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>監査ログ｜りんちゃんの杜</title>
  <link rel="icon" href="../assets/rinchan-face.svg?v=1049" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=157">
  <link rel="stylesheet" href="../css/ui-v042.css?v=157">
  <link rel="stylesheet" href="../css/sync-status-design.css?v=244">
  <link rel="stylesheet" href="../css/admin-design-system.css?v=259">
</head>
<body class="admin-page rinchan-admin-system">
<main class="app admin-app-v132 admin-audit-app">
  <header class="top"><a href="admin.html" class="back icon-button" aria-label="管理画面へ戻る"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a><div class="page-title">管理画面</div><button class="icon-button admin-refresh-button" id="adminAuditRefresh" type="button" aria-label="監査ログを更新"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9A7 7 0 0 1 18 6l2 2M17.9 15A7 7 0 0 1 6 18l-2-2"/></svg></button></header>
  <nav class="nav" aria-label="メインメニュー"><a href="../index.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><small>ホーム</small></a><a href="mori.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22v-7M8 22h8M5 15h14L16 9h2L12 2 6 9h2Z"/></svg><small>杜</small></a><a class="plus" href="activity.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18c-2.5 0-5 1-5 3h10c0-2-2.5-3-5-3Zm6-15c-2 0-3 3.2-3 6s1 5 3 5 3-2.2 3-5-1-6-3-6Z"/></svg><small>歩数記録</small></a><a href="news.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 7l8 6 8-6"/></svg><small>通信</small></a><a href="mypage.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><small>パスポート</small></a></nav>

  <section class="admin-hero">
    <p class="label">管理者専用・閲覧のみ</p>
    <h1>監査ログ</h1>
    <p><span class="admin-hero-line">誰が・いつ・どの操作を行ったか、</span><span class="admin-hero-line">結果と対象を確認できます。</span></p>
    <div class="admin-updated" id="adminAuditStatus">読み込み中...</div>
  </section>

  <section class="admin-grid"><div class="admin-stat"><strong id="adminAuditCount">0件</strong><small>表示中</small></div><div class="admin-stat"><strong id="adminAuditFailureCount">0件</strong><small>失敗・要確認</small></div><div class="admin-stat"><strong id="adminAuditLatestAt">-</strong><small>最新の記録</small></div></section>

  <section class="admin-card">
    <h2>表示する記録</h2>
    <p class="admin-note">初期表示は、職員情報や運用設定などを変更した操作です。条件を変えると、失敗・ログイン・閲覧の記録も確認できます。</p>
    <div class="admin-audit-filters">
      <label><span>種類</span><select id="adminAuditCategory"><option value="change">変更操作</option><option value="error">失敗・要確認</option><option value="access">ログイン</option><option value="view">閲覧</option><option value="">すべて</option></select></label>
      <label><span>結果</span><select id="adminAuditResult"><option value="">すべて</option><option value="ok">成功</option><option value="ng">失敗</option></select></label>
      <label><span>表示件数</span><select id="adminAuditLimit"><option value="50">50件</option><option value="100" selected>100件</option><option value="200">200件</option><option value="300">300件</option></select></label>
      <label><span>キーワード</span><input id="adminAuditQuery" type="search" inputmode="search" autocomplete="off" placeholder="氏名・社員番号・操作・対象"></label>
    </div>
  </section>

  <section class="admin-card">
    <h2>記録一覧</h2>
    <p class="admin-note">各行を開くと、対象や記録内容を確認できます。監査ログはこの画面から変更・削除できません。</p>
    <div id="adminAuditList" class="admin-badge-list"><p class="admin-empty">読み込み中...</p></div>
  </section>

  <section class="big-action focus-action admin-return-action"><a href="admin.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><strong>管理画面へ戻る</strong><small>運用チェックへ戻る</small></a></section>
</main>
<script src="../js/config.js?v=157"></script><script src="../js/core/storage.js?v=240"></script><script src="../js/core/error-log.js?v=157"></script><script src="../js/core/api.js?v=181"></script><script src="../js/core/sync.js?v=256"></script><script src="../js/core/offline-queue.js?v=244"></script><script src="../js/features/admin-audit.js?v=1"></script>
</body>
</html>
