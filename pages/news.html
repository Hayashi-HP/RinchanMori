  <link rel="stylesheet" href="../css/style.css?v=1124"><link rel="stylesheet" href="../css/ui-v042.css?v=1124"><link rel="stylesheet" href="../css/v081-fixes.css?v=1124"><link rel="stylesheet" href="../css/v099-ui-fixes.css?v=1124"><link rel="stylesheet" href="../css/v100-news-ui.css?v=1124"><link rel="stylesheet" href="../css/v102-rinchan-face.css?v=1124"><link rel="stylesheet" href="../css/v108-final-fixes.css?v=1124"><link rel="stylesheet" href="../css/v128-mobile-polish.css?v=1124"><link rel="stylesheet" href="../css/v1013-hotfix.css?v=1124"><link rel="stylesheet" href="../css/v1014-hotfix.css?v=1124"><link rel="stylesheet" href="../css/v1031-badge-polish.css?v=1124"><link rel="stylesheet" href="../css/v1033-news-title.css?v=1124"><link rel="stylesheet" href="../css/v1039-news-layout.css?v=1124"><link rel="stylesheet" href="../css/v1040-news-cards.css?v=1124"><link rel="stylesheet" href="../css/v1041-page-system.css?v=1124"><link rel="stylesheet" href="../css/v1041-news-cleanup.css?v=1124"><link rel="stylesheet" href="../css/v1034-nav-active.css?v=1124">
  <style>
    .received-thanks-card{background:linear-gradient(180deg,#fff 0%,#fff7fb 100%);border:1px solid rgba(226,133,178,.20);box-shadow:0 16px 38px rgba(178,103,137,.10)}
    .received-thanks-list{display:grid;gap:12px}.received-thanks-item{width:100%;text-align:left;border:1px solid rgba(226,133,178,.18);background:#fff;border-radius:22px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 10px 22px rgba(178,103,137,.08)}.received-thanks-item.is-unread{background:linear-gradient(180deg,#fff 0%,#fff0f7 100%)}
    .received-thanks-flower{width:46px;height:46px;border-radius:18px;background:#fff0f7;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}.received-thanks-main{min-width:0;display:block}.received-thanks-main strong{display:block;color:#513149;font-size:16px;line-height:1.45}.received-thanks-main p{margin:5px 0 0;color:#415146;font-weight:850;line-height:1.65}.received-thanks-main time{display:block;margin-top:8px;color:#7a8a7d;font-size:12px;font-weight:900}.received-thanks-empty{padding:18px;text-align:center;color:#667568;font-weight:900;line-height:1.7;background:#fff;border-radius:22px;border:1px dashed rgba(226,133,178,.26)}
    .received-thanks-actions{display:block;margin-top:10px}.received-thanks-receive{appearance:none;border:0;border-radius:999px;background:linear-gradient(135deg,#1f7f3a 0%,#58bd72 100%);color:#fff;font-size:15px;font-weight:950;min-height:42px;padding:0 22px;box-shadow:0 8px 18px rgba(31,127,58,.16)}.received-thanks-receive:active{transform:scale(.98);filter:brightness(.96)}.received-thanks-done{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 14px;border-radius:999px;background:#f1f8f3;color:#61766e;font-size:13px;font-weight:950}
  </style>
</head>
<body>
<main class="app news-page" id="rinchanNewsPage">
  <header class="top"><a href="../index.html" class="back" aria-label="戻る">←</a><div class="page-title">りんちゃん通信</div><span class="spacer"></span></header>
  <section class="news-hero"><h1>今日の杜だより</h1><p>みんなの歩みとありがとうを表示します。</p></section>
  <section class="card news-summary-card"><div class="section-head-row compact-gap"><div><p class="label">🌳 今日の杜</p><h2>今日のまとめ</h2></div><span class="summary-pill" id="newsSummaryDate">読み込み中</span></div><div class="forest-summary-stats" id="forestSummaryStats"></div></section>
  <section class="card news-section-card received-thanks-card"><div class="section-head-row"><div><p class="label">🌸 あなたに届いた花</p><h2>ありがとうの花アルバム</h2></div></div><div id="receivedThanksList" class="received-thanks-list"><p class="received-thanks-empty">届いたありがとうを読み込み中...</p></div></section>
  <section class="card news-section-card thanks-flow-card"><div class="section-head-row"><div><p class="label">💌 ありがとうの広がり</p><h2>部署をこえたありがとう</h2></div></div><div id="thanksFlowSummary" class="thanks-flow-summary"><p class="empty-note news-empty">読み込み中...</p></div><div id="thanksStoryList" class="thanks-story-list thanks-inline-list"></div></section>
  <section class="card news-section-card" id="noticeSection"><div class="section-head-row"><div><p class="label">🔔 お知らせ</p></div></div><div id="noticeList" class="notice-list"></div></section>
  <section class="card news-section-card"><div class="section-head-row"><div><p class="label">📣 グループニュース</p></div></div><div id="groupNewsList" class="group-news-list"></div></section>
  <nav class="nav"><a href="../index.html">🏠<small>ホーム</small></a><a href="mori.html">🌳<small>杜</small></a><a class="plus" href="activity.html">👟<small>歩数記録</small></a><a class="active" href="news.html">📬<small>通信</small></a><a href="mypage.html">👤<small>マイページ</small></a></nav>
</main>
<script src="../js/config.js?v=1124"></script><script src="../js/core/storage.js?v=1124"></script><script src="../js/core/error-log.js?v=1124"></script><script src="../js/core/api.js?v=1124"></script><script src="../js/core/sync.js?v=1124"></script><script src="../js/core/offline-queue.js?v=1124"></script><script src="../js/core/rinchan-modal.js?v=1124"></script><script src="../js/features/news.js?v=1124"></script><script src="../js/features/activity.js?v=1124"></script>
<script>(function(){async function refreshNews(){try{if(window.RinchanSync&&typeof RinchanSync.sync==='function')await RinchanSync.sync({silent:true});if(window.RinchanNews&&typeof RinchanNews.refreshPublicThanks==='function')await RinchanNews.refreshPublicThanks();if(window.RinchanNews&&typeof RinchanNews.renderAll==='function')RinchanNews.renderAll();}catch(e){}}document.addEventListener('DOMContentLoaded',function(){setTimeout(refreshNews,100);setTimeout(refreshNews,900);});window.addEventListener('pageshow',function(){setTimeout(refreshNews,100);});})();</script>
</body>
