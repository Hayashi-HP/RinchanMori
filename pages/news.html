<script>(function(){async function refreshNews(){try{if(window.RinchanSync&&typeof RinchanSync.sync==='function')await RinchanSync.sync({silent:true});if(window.RinchanNews&&typeof RinchanNews.refreshPublicThanks==='function')await RinchanNews.refreshPublicThanks();if(window.RinchanNews&&typeof RinchanNews.refreshPublicNotices==='function')await RinchanNews.refreshPublicNotices();if(window.RinchanNews&&typeof RinchanNews.renderAll==='function')RinchanNews.renderAll();if(window.RinchanForestSummaryFix&&typeof RinchanForestSummaryFix.renderAll==='function')RinchanForestSummaryFix.renderAll();}catch(e){}}document.addEventListener('DOMContentLoaded',function(){setTimeout(refreshNews,100);setTimeout(refreshNews,900);setTimeout(refreshNews,2200);});window.addEventListener('pageshow',function(){setTimeout(refreshNews,100);});})();</script>
