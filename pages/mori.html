  <section class="mori-page-intro">
    <p class="eyebrow">みんなで育てる場所</p>
    <h1>今日の杜</h1>
    <p id="moriSeasonMessage">今日の杜の様子を表示しています。</p>
  </section>

  <div class="mori-dashboard">
    <section class="card news-summary-card" id="moriStatusCard">
      <div class="section-head-row"><div><p class="eyebrow">杜の成長</p><h2>みんなで育てる杜</h2></div><span class="summary-pill" id="moriStatusSteps">累計 0歩</span></div>
      <div class="forest-hero-row"><div class="forest-hero-icon" id="moriStatusIcon">🌱</div><div class="forest-hero-copy"><h3 id="moriStatusLevel">杜レベル 1</h3><p>全員の歩みとありがとうで、杜全体が育ちます。</p></div></div>
      <div class="forest-progress-wrap"><div class="forest-progress"><div id="moriStatusProgressBar" style="width:0%"></div></div><p class="forest-progress-note" id="moriStatusProgressNote">あと10,000歩でレベル 2</p></div>
    </section>

    <section class="card mori-visual dashboard-hero">
      <div class="mori-map-heading"><div><p class="eyebrow">部署の木</p><h2>杜を歩いてみる</h2></div><span class="mori-note" id="moriUpdatedAt">杜を読み込み中</span></div>
      <div class="mori-map live-mori-map mori-game-map" id="moriMap"></div>
      <div class="mori-detail-slot" id="moriDetailSlot"></div>
    </section>

    <section id="moriDailyLetterCard" class="card mori-daily-letter-card">
      <div class="card-heading"><div><p class="eyebrow">杜だより</p><h2 id="moriDailyLetterText">今日の杜を見ていこう</h2></div></div>
    </section>

    <section id="moriThanksWorldCard" class="card mori-thanks-world-card">
      <div class="card-heading"><div><p class="eyebrow">杜の花だより</p><h2>やさしさで育つ杜</h2></div></div>
      <div class="mori-flower-stats"><div class="mori-flower-stat"><strong id="moriFlowerCount">0輪</strong><small>咲いた花</small></div><div class="mori-flower-stat"><strong id="moriButterflyCount">0匹</strong><small>ちょうちょ</small></div><div class="mori-flower-stat"><strong id="moriBirdCount">0羽</strong><small>小鳥</small></div></div>
      <p class="mori-thanks-note" id="moriThanksWorldNote">ありがとうが届くと、ここに花が咲いていきます。</p><div id="moriDeptFlowers" class="mori-thanks-note"></div>
    </section>

    <section class="card forest-card"><div class="card-heading"><div><p class="eyebrow">杜の見どころ</p><h2 id="moriHighlightTitle">今日の杜</h2></div></div><p id="moriHighlightText">季節と時間に合わせて、杜の景色が変わります。</p></section>

    <section id="treeInfoCard" class="card tree-info-card hidden"></section>
  </div>
