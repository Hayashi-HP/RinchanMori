<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>歩数記録｜りんちゃんの杜</title>
  <link rel="icon" href="../assets/rinchan-face.svg?v=1049" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=178">
  <link rel="stylesheet" href="../css/ui-v042.css?v=178">
  <link rel="stylesheet" href="../css/activity-design-system.css?v=225">
  <link rel="stylesheet" href="../css/modern-shell.css?v=230">
</head>
<body class="rinchan-activity-system">
<main class="app activity-page">
  <header class="top">
    <a class="back icon-button" href="../index.html" aria-label="ホームへ戻る">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="page-title">歩数記録</div>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <nav class="nav" aria-label="メインメニュー">
    <a href="../index.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><small>ホーム</small></a>
    <a href="mori.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22v-7M8 22h8M5 15h14L16 9h2L12 2 6 9h2Z"/></svg><small>杜</small></a>
    <a class="plus active" href="activity.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18c-2.5 0-5 1-5 3h10c0-2-2.5-3-5-3Zm6-15c-2 0-3 3.2-3 6s1 5 3 5 3-2.2 3-5-1-6-3-6Z"/></svg><small>歩数記録</small></a>
    <a href="news.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 7l8 6 8-6"/></svg><small>通信</small><span class="notify-badge hidden">0</span></a>
    <a href="mypage.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><small>パスポート</small></a>
  </nav>

  <section id="guestActivityLock" class="guest-panel hidden">
    <img class="rin-img" src="../assets/rinchan-face.svg?v=178" alt="りんちゃん">
    <div><p class="eyebrow">歩数記録</p><h1>まずは登録してください</h1><p>歩数記録は、社員番号で新規登録またはログインした後に使えます。</p><a class="gradient-button" href="register.html">新規登録する</a><p class="login-helper"><a href="login.html">登録済みの方はログイン</a></p></div>
  </section>

  <section id="activityContent" class="activity-content">
    <section id="activityIntro" class="activity-hero">
      <div><p class="eyebrow">今日の記録</p><h1><span>今日も、</span><span>おつかれさまです</span></h1><p id="rinchanVoiceMessage">30秒で歩数を記録できます。</p></div>
    </section>

    <div class="activity-grid">
      <section class="card activity-summary-card" aria-labelledby="activitySummaryTitle">
        <div class="card-heading"><div><p class="eyebrow">歩数サマリー</p><h2 id="activitySummaryTitle">選択した週の歩数</h2></div><span class="summary-date" id="activitySummaryDate">今週</span></div>
        <div class="activity-summary-main">
          <div class="activity-ring" id="activityProgressRing" role="progressbar" aria-label="週間歩数目標の進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="activity-ring-inner"><p>今週の歩数</p><div><strong id="activitySummarySteps">0</strong><span>歩</span></div><small id="activitySummaryGoal">週間目標を確認中</small></div>
          </div>
          <div class="week-overview"><div class="week-heading"><strong>今週の歩数</strong><span id="activityWeekTotal">0歩</span></div><div class="activity-week-bars" id="activityWeekBars" aria-label="今週7日間の歩数グラフ"></div></div>
        </div>
      </section>

      <form class="card activity-form" id="activityForm">
        <div class="card-heading"><div><p class="eyebrow">記録する</p><h2>今日の一歩を杜へ</h2></div></div>
        <label>活動日<input id="activityDate" type="date" required></label>
        <label>歩数<div class="steps-input-wrap"><input id="steps" type="number" inputmode="numeric" min="0" placeholder="例：6230" required><span>歩</span></div></label>
        <label class="check"><input id="challenge" type="checkbox"><span id="weeklyGoalChallengeText">今週の目標</span></label>
        <label>ひとこと（任意）<textarea id="comment" rows="2" placeholder="例：少し歩けました"></textarea></label>
        <button class="gradient-button" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>杜に届ける</span></button>
      </form>

      <section class="card activity-tools-card">
        <div class="card-heading"><div><p class="eyebrow">最近の記録</p><h2>直近5件</h2></div></div>
        <div id="activityToolsList" class="activity-tools-list"><p class="empty-note">読み込み中...</p></div>
      </section>
    </div>
  </section>

  <section id="complete" class="complete hidden"><div class="complete-icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><h1>あなたの木に<br>新しい葉っぱが増えました</h1><p id="rinchanCompleteVoiceMessage">記録できました。小さな一歩でも、ちゃんと杜につながっています。</p><a class="gradient-button" href="../index.html">ホームへ戻る</a></section>
</main>
<script src="../js/core/device-class.js?v=214"></script><script src="../js/config.js?v=219"></script><script src="../js/core/storage.js?v=178"></script><script src="../js/core/error-log.js?v=178"></script><script src="../js/core/api.js?v=178"></script><script src="../js/core/sync.js?v=178"></script><script src="../js/core/offline-queue.js?v=178"></script><script src="../js/features/auth.js?v=178"></script><script src="../js/features/activity.js?v=214"></script><script src="../js/features/activity-dashboard.js?v=219"></script><script src="../js/features/mypage.js?v=178"></script><script src="../js/features/voice.js?v=178"></script><script>(function(){document.addEventListener('DOMContentLoaded',function(){var user=(typeof RinchanStorage!=='undefined'&&RinchanStorage&&typeof RinchanStorage.getParticipant==='function')?RinchanStorage.getParticipant():JSON.parse(localStorage.getItem('rinchanParticipant')||'null');if(!user||!(user.employeeId||user.id)){document.getElementById('guestActivityLock').classList.remove('hidden');document.getElementById('activityContent').classList.add('hidden');return;}var goal=String(user.weeklyGoal||'').trim();var el=document.getElementById('weeklyGoalChallengeText');if(el)el.textContent=goal?'今週の目標：'+goal:'今週の目標';try{if(window.RinchanVoice&&typeof RinchanVoice.render==='function'){RinchanVoice.render('rinchanVoiceMessage');RinchanVoice.render('rinchanCompleteVoiceMessage','complete');}}catch(e){}});})();</script>
<script src="../js/features/news.js?v=226"></script>
</body>
</html>
