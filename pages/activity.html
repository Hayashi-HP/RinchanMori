<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>歩数記録</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/ui-v042.css">
</head>
<body>
<main class="app">
  <header class="top"><a href="../index.html" class="back">←</a><div class="page-title">歩数記録</div><span class="spacer"></span></header>

  <section id="guestActivityLock" class="intro hidden">
    <div class="rin small">😊</div>
    <h1>まずは登録してください</h1>
    <p>歩数記録は、社員番号で初回登録またはログインした後に使えます。</p>
    <a class="submit link-submit" href="register.html">初回登録する</a>
    <a class="soft-link" href="login.html">登録済みの方はログイン</a>
  </section>

  <section id="activityIntro" class="intro"><div class="rin small">😊</div><h1>今日も<br>おつかれさまです</h1><p>30秒で歩数を記録できます。</p></section>

  <form class="form" id="activityForm"><label>活動日<input id="activityDate" type="date" required></label><label>歩数<input id="steps" type="number" placeholder="例：6230" required></label><label>スクリーンショット<input type="file" accept="image/*"></label><label class="check"><input id="challenge" type="checkbox">今週のチャレンジ：階段を使った</label><label>ひとこと（任意）<textarea id="comment" rows="3" placeholder="例：少し歩けました"></textarea></label><button class="submit pill-button" type="submit">記録する</button></form>

  <section id="complete" class="complete hidden"><div class="tree-large">🌱</div><h1>あなたの木に<br>新しい葉っぱが増えました</h1><p>今日もありがとうございました。</p><a class="submit link-submit" href="../index.html">ホームへ戻る</a></section>
</main>
<script src="../js/config.js"></script><script src="../js/app.js"></script><script src="../js/v051-auth.js"></script><script>
(function(){
  function p(){try{return JSON.parse(localStorage.getItem('rinchanParticipant')||'null')}catch(e){return null}}
  document.addEventListener('DOMContentLoaded',function(){
    var user=p();
    if(!user||!user.id){
      document.getElementById('guestActivityLock').classList.remove('hidden');
      document.getElementById('activityIntro').classList.add('hidden');
      document.getElementById('activityForm').classList.add('hidden');
    }
  });
})();
</script></body></html>
