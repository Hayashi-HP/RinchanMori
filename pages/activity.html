<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動を記録する</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="app"><header class="top"><a href="../index.html" class="back">←</a><div class="page-title">活動を記録する</div><span class="spacer"></span></header><section class="intro"><div class="rin small">😊</div><h1>今日も<br>おつかれさまです</h1><p>30秒で記録できます。</p></section><form class="form" id="activityForm"><label>活動日<input id="activityDate" type="date" required></label><label>歩数<input id="steps" type="number" placeholder="例：6230" required></label><label>スクリーンショット<input type="file" accept="image/*"></label><label class="check"><input id="challenge" type="checkbox">今週のチャレンジ：階段を使った</label><label>ひとこと（任意）<textarea id="comment" rows="3" placeholder="例：少し歩けました"></textarea></label><button class="submit">記録する</button></form><section id="complete" class="complete hidden"><div class="tree-large">🌱</div><h1>あなたの木に<br>新しい葉っぱが増えました</h1><p>今日もありがとうございました。</p><a class="submit link-submit" href="../index.html">ホームへ戻る</a></section></main><script src="../js/config.js"></script><script src="../js/app.js"></script></body></html>
