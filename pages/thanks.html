<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ありがとう｜りんちゃんの杜 v1.0.15</title>
  <link rel="stylesheet" href="../css/style.css?v=1015">
  <link rel="stylesheet" href="../css/ui-v042.css?v=1015">
  <link rel="stylesheet" href="../css/v081-fixes.css?v=1015">
  <link rel="stylesheet" href="../css/v128-mobile-polish.css?v=1015">
  <link rel="stylesheet" href="../css/v1014-hotfix.css?v=1015">
</head>
<body>
<main class="app">
  <header class="top"><a href="mori.html" class="back">←</a><div class="page-title">ありがとう</div><span class="spacer"></span></header>
  <section class="intro"><h1>ありがとうを送る</h1><p id="thanksTargetText">送信先を確認しています。</p></section>
  <section class="card">
    <p class="label">💌 ありがとう</p>
    <h2 id="thanksTitle">仲間へありがとう</h2>
    <label class="form label" style="margin:16px 0 0;padding:0;border:0;box-shadow:none;background:transparent;">
      種類
      <select id="thanksReason">
        <option value="ありがとう">ありがとう</option>
        <option value="助けてもらった">助けてもらった</option>
        <option value="声をかけてもらった">声をかけてもらった</option>
        <option value="一緒にがんばった">一緒にがんばった</option>
      </select>
    </label>
    <button id="sendThanksButton" class="submit" type="button" style="margin-top:18px;">送信する</button>
  </section>
  <nav class="nav"><a href="../index.html">🏠<small>ホーム</small></a><a class="active" href="mori.html">🌳<small>杜</small></a><a class="plus" href="activity.html">👟<small>歩数記録</small></a><a href="news.html">📬<small>通信</small></a><a href="mypage.html">👤<small>マイページ</small></a></nav>
</main>
<script src="../js/config.js?v=1015"></script><script src="../js/core/storage.js?v=1015"></script><script src="../js/core/error-log.js?v=1015"></script><script src="../js/core/api.js?v=1015"></script><script src="../js/core/sync.js?v=1015"></script>
<script>
(function(){
  function readTarget(){ try { return JSON.parse(sessionStorage.getItem('rinchanThanksTarget') || 'null'); } catch(e) { return null; } }
  function user(){ try { return window.RinchanStorage ? RinchanStorage.getParticipant() : JSON.parse(localStorage.getItem('rinchanParticipant') || 'null'); } catch(e) { return null; } }
  function deviceId(){ try { return window.RinchanStorage ? RinchanStorage.deviceId() : localStorage.getItem('rinchanDeviceId'); } catch(e) { return ''; } }
  function apply(){
    var target = readTarget();
    var text = document.getElementById('thanksTargetText');
    var title = document.getElementById('thanksTitle');
    if (!target || !target.toEmployeeId) {
      if (text) text.textContent = '送信先が見つかりません。杜ページから選び直してください。';
      var btn = document.getElementById('sendThanksButton'); if (btn) btn.disabled = true;
      return;
    }
    if (text) text.textContent = (target.toName || '仲間') + 'さんへありがとうを送ります。';
    if (title) title.textContent = (target.toName || '仲間') + 'さんへ';
  }
  async function send(){
    var target = readTarget();
    var me = user();
    if (!target || !target.toEmployeeId || !me || !(me.employeeId || me.id)) return;
    var btn = document.getElementById('sendThanksButton');
    var reason = document.getElementById('thanksReason');
    if (btn) { btn.disabled = true; btn.textContent = '送信中'; }
    var payload = {
      thanksId: 'K' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      fromParticipantId: me.employeeId || me.id,
      fromName: me.nick || me.name || '杜の仲間',
      toParticipantId: target.toEmployeeId,
      toName: target.toName || '仲間',
      toDept: target.toDept || '',
      reason: reason ? reason.value : 'ありがとう',
      createdAt: new Date().toISOString(),
      deviceId: deviceId(),
      version: 'v1.0.15'
    };
    var result = window.RinchanApi ? await RinchanApi.request('saveThanks', payload) : { ok:false };
    if (result && result.ok) {
      if (window.RinchanSync && typeof RinchanSync.applyApiResult === 'function') RinchanSync.applyApiResult(result);
      sessionStorage.removeItem('rinchanThanksTarget');
      alert('ありがとうを送りました。');
      location.href = 'mori.html';
    } else {
      alert('送信できませんでした。少し時間をおいてもう一度お試しください。');
      if (btn) { btn.disabled = false; btn.textContent = '送信する'; }
    }
  }
  document.addEventListener('DOMContentLoaded', function(){ apply(); var btn = document.getElementById('sendThanksButton'); if (btn) btn.addEventListener('click', send); });
})();
</script>
</body>
</html>
