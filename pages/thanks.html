<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>やさしさを届けよう｜りんちゃんの杜</title>
  <link rel="icon" href="../assets/rinchan-face.svg?v=1049" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css?v=178">
  <link rel="stylesheet" href="../css/ui-v042.css?v=178">
  <link rel="stylesheet" href="../css/thanks-design-system.css?v=237">
</head>
<body class="rinchan-thanks-system">
<main class="app thanks-page">
  <header class="top">
    <a class="icon-button" href="mori.html" aria-label="杜へ戻る"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="page-title">ありがとうを送る</div>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <nav class="nav" aria-label="メインメニュー">
    <a href="../index.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><small>ホーム</small></a>
    <a class="active" href="mori.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22v-7M8 22h8M5 15h14L16 9h2L12 2 6 9h2Z"/></svg><small>杜</small></a>
    <a class="plus" href="activity.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18c-2.5 0-5 1-5 3h10c0-2-2.5-3-5-3Zm6-15c-2 0-3 3.2-3 6s1 5 3 5 3-2.2 3-5-1-6-3-6Z"/></svg><small>歩数記録</small></a>
    <a href="news.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 7l8 6 8-6"/></svg><small>通信</small><span class="notify-badge hidden">0</span></a>
    <a href="mypage.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><small>パスポート</small></a>
  </nav>

  <section class="thanks-intro">
    <p class="eyebrow">やさしさを届ける</p>
    <h1>ありがとうを送る</h1>
    <p>仲間への感謝を言葉にして、杜につながりを育てます。</p>
  </section>

  <div class="thanks-layout">
    <section class="card thanks-target-panel">
      <div class="section-heading"><p class="eyebrow">届け先</p><h2>ありがとうを送る相手</h2></div>
      <div id="thanksTargetCard" class="thanks-target-card"><div class="thanks-target-avatar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.2-8.7C.8 8.7 2.8 5 6.5 5c2.1 0 3.7 1.2 4.5 2.5C11.8 6.2 13.4 5 15.5 5c3.7 0 5.7 3.7 3.7 7.3C17 16.4 12 21 12 21Z"/></svg></div><div><strong id="thanksTargetName">送信先を確認しています</strong><small id="thanksTargetText">杜ページから選んだ仲間へ届けます</small></div></div>
      <p class="thanks-guidance">送信先を変更する場合は、杜ページに戻って仲間を選び直してください。</p>
    </section>

    <section class="card thanks-form-card">
      <div class="section-heading"><p class="eyebrow">ありがとうの内容</p><h2 id="thanksTitle">仲間へやさしさを届ける</h2><p class="section-note">短いひとことでも大丈夫です。</p></div>
      <label class="thanks-field">ありがとうの種類<select id="thanksReason" class="thanks-select"><option value="ありがとう">ありがとう</option><option value="助けてもらった">助けてもらった</option><option value="声をかけてもらった">声をかけてもらった</option><option value="一緒にがんばった">一緒にがんばった</option></select></label>
      <label class="thanks-field">メッセージ（任意）<textarea id="thanksComment" class="thanks-message" rows="3" placeholder="どんなことがうれしかった？&#10;ひとことでも大丈夫です"></textarea></label>
      <button id="sendThanksButton" class="thanks-submit" type="button">ありがとうを届ける</button>
    </section>
  </div>
</main>
<script src="../js/config.js?v=237"></script><script src="../js/core/storage.js?v=240"></script><script src="../js/core/error-log.js?v=1066"></script><script src="../js/core/api.js?v=1066"></script><script src="../js/core/sync.js?v=240"></script><script src="../js/core/rinchan-modal.js?v=1066"></script>
<script>
(function(){
  function readTarget(){ try { return JSON.parse(sessionStorage.getItem('rinchanThanksTarget') || 'null'); } catch(e) { return null; } }
  function user(){ try { return window.RinchanStorage ? RinchanStorage.getParticipant() : JSON.parse(localStorage.getItem('rinchanParticipant') || 'null'); } catch(e) { return null; } }
  function deviceId(){ try { return window.RinchanStorage ? RinchanStorage.deviceId() : localStorage.getItem('rinchanDeviceId'); } catch(e) { return ''; } }
  function escapeHtml(value){ return String(value || '').replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; }); }
  function localThanks(payload){
    try{
      var list = JSON.parse(localStorage.getItem('rinchanThanks') || '[]');
      if(!Array.isArray(list)) list = [];
      list.unshift(payload);
      localStorage.setItem('rinchanThanks', JSON.stringify(list.slice(0,100)));
    }catch(e){}
  }
  function flowerBurst(){
    for(var i=0;i<14;i++){
      var p=document.createElement('div');
      p.className='thanks-petal';
      p.textContent=i%3===0?'🌸':'🌼';
      p.style.left=(50 + (Math.random()*46-23))+'%';
      p.style.top=(58 + (Math.random()*16-8))+'%';
      p.style.animationDelay=(Math.random()*0.25)+'s';
      document.body.appendChild(p);
      setTimeout(function(el){ if(el&&el.parentNode) el.parentNode.removeChild(el); },1500,p);
    }
  }
  function apply(){
    var target = readTarget();
    var text = document.getElementById('thanksTargetText');
    var name = document.getElementById('thanksTargetName');
    var title = document.getElementById('thanksTitle');
    if (!target || !target.toEmployeeId) {
      if (name) name.textContent = '送信先が見つかりません';
      if (text) text.textContent = '杜ページから、もう一度仲間を選んでね。';
      var btn = document.getElementById('sendThanksButton'); if (btn) btn.disabled = true;
      if(window.RinchanModal) setTimeout(function(){ RinchanModal.show({speech:'あれれ？\n届け先が見つからないみたい。',note:'杜ページからもう一度選んでね。',primaryText:'杜へ戻る',onPrimary:function(){location.href='mori.html';},hideClose:true}); },300);
      return;
    }
    var toName = target.toName || '仲間';
    if (name) name.textContent = toName + ' さん';
    if (text) text.textContent = 'この仲間へ、ありがとうの花を届けます🌸';
    if (title) title.textContent = toName + 'さんへ';
  }
  async function send(){
    var target = readTarget();
    var me = user();
    if (!target || !target.toEmployeeId || !me || !(me.employeeId || me.id)) return;
    var btn = document.getElementById('sendThanksButton');
    var reason = document.getElementById('thanksReason');
    var comment = document.getElementById('thanksComment');
    if (btn) { btn.disabled = true; btn.textContent = 'ありがとうを届けています'; }
    var payload = {
      thanksId: 'K' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      fromParticipantId: me.employeeId || me.id,
      fromName: me.nick || me.name || '杜の仲間',
      toParticipantId: target.toEmployeeId,
      toName: target.toName || '仲間',
      toDept: target.toDept || '',
      reason: reason ? reason.value : 'ありがとう',
      comment: comment ? String(comment.value || '').trim() : '',
      createdAt: new Date().toISOString(),
      deviceId: deviceId(),
      version: 'v1.0.66'
    };
    localThanks(payload);
    var result = window.RinchanApi ? await RinchanApi.request('saveThanks', payload) : { ok:false };
    if (result && result.ok) {
      if (window.RinchanSync && typeof RinchanSync.applyApiResult === 'function') RinchanSync.applyApiResult(result);
    }
    sessionStorage.removeItem('rinchanThanksTarget');
    flowerBurst();
    if (window.RinchanModal) {
      RinchanModal.show({
        speech: '届いたよ♡\nきっと笑顔になるね😊',
        note: escapeHtml(payload.toName) + 'さんの木に、ありがとうの花が咲いたよ🌸',
        primaryText: '杜へ戻る',
        onPrimary: function(){ location.href = 'mori.html'; },
        closeText: 'もう一度見る'
      });
    } else {
      alert('ありがとうを届けました。');
      location.href = 'mori.html';
    }
    if (btn) { btn.disabled = false; btn.textContent = 'ありがとうを届ける'; }
  }
  document.addEventListener('DOMContentLoaded', function(){ apply(); var btn = document.getElementById('sendThanksButton'); if (btn) btn.addEventListener('click', send); });
})();
</script>
</body>
</html>
